<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #e8ecef;
    height: 100vh;
    overflow: hidden;
  }

  /* 登录页 */
  #loginPage {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #6a9bff, #4a7cff);
  }
  #loginBox {
    background: #fff;

    padding: 40px 32px;
    width: 320px;
    text-align: center;
    box-shadow: 0 10px 40px rgba(0,0,0,.2);

  #loginBox h1 { font-size: 26px; color: #2b3a55; margin-bottom: 6px; }
  #loginBox .sub { font-size: 13px; color: #999; margin-bottom: 24px; }
  #nickInput {
    width: 100%; padding: 12px; font-size: 15px;
    border: 1px solid #d5dae0; border-radius: 8px;
    outline: none; text-align: center; margin-bottom: 12px;
  }
  #nickInput:focus { border-color: #4a7cff; }
  #loginBtn {
    width: 100%; padding: 12px; font-size: 15px;
    border: none; background: #4a7cff; color: #fff;
    border-radius: 8px; cursor: pointer;
  }
  #loginBtn:hover { background: #3a6ae0; }

  /* 主界面 */
  #mainPage { display: none; height: 100vh; background: #fff; }
  #app { width: 100%; height: 100%; display: grid; grid-template-columns: 220px 1fr; }
  #sidebar { background: #2b3a55; color: #fff; padding: 14px 10px; overflow-y: auto; }
  .my-info {
    padding: 8px 10px; border-bottom: 1px solid rgba(255,255,255,.1);
    margin-bottom: 10px; font-size: 14px;
  }
  .my-info .me-name { font-weight: 600; }
  .my-info .me-status { font-size: 11px; color: #7bd88f; margin-top: 2px; }
  .section-title { font-size: 11px; color: rgba(255,255,255,.4); padding: 8px 10px 4px; }
  .contact {
    padding: 9px 10px; border-radius: 8px; font-size: 14px;
    display: flex; align-items: center; gap: 8px; cursor: pointer;
  }
  .contact:hover { background: rgba(255,255,255,.08); }
  .contact.active { background: rgba(255,255,255,.15); }
  .contact.disabled {
    cursor: default;
    opacity: .55;
  }
  .contact.disabled:hover { background: transparent; }
  .avatar {
    width: 28px; height: 28px; border-radius: 50%;
    background: #6a9bff; display: flex; align-items: center;
    justify-content: center; font-size: 13px; flex-shrink: 0; color: #fff;
    background-size: cover; background-position: center;
  }
  .contact .name {
    flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .contact .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: #7bd88f; flex-shrink: 0;
  }
  .contact.offline .dot { background: #666; }
  .contact .badge {
    background: #ff4d4f; color: #fff; font-size: 11px;
    padding: 1px 6px; border-radius: 10px;
  }

  /* 聊天区 */
  #chat { display: flex; flex-direction: column; background: #f5f6f8; min-height: 0; min-width: 0; }
  #chatHeader {
    background: #fff; padding: 12px 18px;
    border-bottom: 1px solid #e2e5e9;
    font-size: 15px; font-weight: 600; color: #2b3a55;
    display: flex; align-items: center; gap: 10px;
    flex-shrink: 0;
  }
  #chatHeader .header-avatar {
    width: 30px; height: 30px; border-radius: 50%;
    background: #ff8c42; color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
    background-size: cover; background-position: center;
  }
  #messages {
    flex: 1; min-height: 0; overflow-y: auto; padding: 16px;
    display: flex; flex-direction: column; gap: 10px;
  }
  #messages::-webkit-scrollbar { width: 8px; }
  #messages::-webkit-scrollbar-thumb {
    background: #c3c9d2; border-radius: 4px;
  }
  #messages::-webkit-scrollbar-thumb:hover { background: #a8afb9; }
  #messages::-webkit-scrollbar-track { background: transparent; }

  .msg {
    max-width: 75%; padding: 9px 12px; border-radius: 10px;
    font-size: 14px; line-height: 1.55; white-space: pre-wrap;
    word-break: break-word; animation: pop .2s ease-out;
  }
  @keyframes pop {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .them { align-self: flex-start; background: #fff; border: 1px solid #e2e5e9; }
  .me { align-self: flex-end; background: #4a7cff; color: #fff; }
  .system { align-self: center; font-size: 12px; color: #888; padding: 2px; }
  #choices {
    padding: 10px 16px 16px; display: flex;
    flex-direction: column; gap: 8px; background: #f5f6f8;
    flex-shrink: 0;
  }
  #choices button {
    text-align: left; padding: 10px 12px; font-size: 14px;
    border: 1px solid #cfd6e0; background: #fff;
    border-radius: 8px; cursor: pointer; transition: .15s;
  }
  #choices button:hover { background: #eef3ff; border-color: #4a7cff; }
  #choices button:disabled { opacity: .5; cursor: default; }

  /* 新好友弹窗 */
  #friendPopup {
    display: none; position: fixed; top: 20px; right: 20px;
    background: #fff; border-radius: 10px;
    box-shadow: 0 8px 30px rgba(0,0,0,.18);
    padding: 14px 16px; width: 280px; z-index: 100;
    animation: slidein .25s ease-out;
  }
  @keyframes slidein {
    from { opacity: 0; transform: translateX(20px); }
    to { opacity: 1; transform: translateX(0); }
  }
  #friendPopup .pop-title { font-size: 12px; color: #888; margin-bottom: 8px; }
  #friendPopup .pop-body {
    display: flex; align-items: center; gap: 10px; margin-bottom: 12px;

  #friendPopup .pop-msg { font-size: 12px; color: #666; margin-top: 2px; }

  #acceptBtn:hover { background: #3a6ae0; }
  #rejectBtn { background: #eef0f3; color: #666; }
.msg.link{

 cursor:pointer;

    background-image: url("avatar-cai.png") !important;
    background-size: cover !important;
    background-position: center !important;

}
</style>

function playEnding() {
    const choice = localStorage.getItem("shardChoice");
    const data = endingScripts[choice];
    if (!data) return;

    data.chat.forEach((text, i) => {
        setTimeout(() => addMessage(text, "them"), i * MSG_INTERVAL);
    });

    const delay = data.chat.length * MSG_INTERVAL + 1000;
    setTimeout(() => showEndingPopup(data.ending), delay);

function playIdentityReveal(callback) {
    const overlay = document.createElement("div");
    overlay.style.cssText = "position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;z-index:99999;color:#fff;font-family:'Courier New',monospace;";
    
    const text = document.createElement("div");
    text.style.cssText = "font-size:32px;letter-spacing:6px;text-align:center;transition:all 1s;";
    text.textContent = "而你的真实身份……";
    overlay.appendChild(text);
    document.body.appendChild(overlay);

    // 第一段淡入
    setTimeout(() => {
        text.style.opacity = "1";
    }, 100);

    // 第二段：切换文字
    setTimeout(() => {
        text.style.opacity = "0";
    }, 2200);

    setTimeout(() => {
        text.textContent = "“我是谁并不重要”";
        text.style.opacity = "1";
        text.style.fontSize = "40px";
    }, 3000);

    // 第三段：闪烁 + 逐步缩减
    setTimeout(() => {
        // 闪烁
        let blink = 0;
        const blinkTimer = setInterval(() => {
            text.style.opacity = (blink % 2 === 0) ? "0.2" : "1";
            blink++;
            if (blink > 6) {
                clearInterval(blinkTimer);
                text.style.opacity = "1";
            }
        }, 120);

        // 缩减文字
        setTimeout(() => {
            text.textContent = "“我是谁”";
            text.style.color = "#c44a2a";
        }, 1000);

        setTimeout(() => {
            text.textContent = "“我是”";
            text.style.fontSize = "56px";
        }, 1800);

        setTimeout(() => {
            text.textContent = "“我”";
            text.style.fontSize = "80px";
            text.style.textShadow = "0 0 30px #c44a2a";
        }, 2600);

        // 结束
        setTimeout(() => {
            overlay.style.transition = "opacity 1s";
            overlay.style.opacity = "0";
            setTimeout(() => {
                overlay.remove();
                if (callback) callback();
            }, 1000);
        }, 4500);
    }, 4200);
}

  function showNode(key) {
    const node = script[key];
    choicesEl.innerHTML = "";
    node.messages.forEach((text, i) => {
      setTimeout(() => { addMessage(text, "them"); }, i * MSG_INTERVAL);
    });
    const delay = node.messages.length * MSG_INTERVAL + 500;
    setTimeout(() => {
      choicesEl.innerHTML = "";
      node.choices.forEach(choice => {
        const btn = document.createElement("button");
        btn.textContent = choice.text;
        btn.onclick = () => {
          addMessage(choice.text, "me");
          [...choicesEl.children].forEach(b => b.disabled = true);
          choicesEl.innerHTML = "";
   if (choice.goto) {
  setTimeout(() => { window.location.href = choice.goto; }, 600);
  return;
}
          if (choice.end) {
            setTimeout(() => {
              addSystem("—— 委托已接取。请前往校园论坛 ——");
            }, 500);
            return;
          }
          setTimeout(() => showNode(choice.next), 600);
        };
        choicesEl.appendChild(btn);
      });
    }, delay);
  }
  // ===== 启动检查 =====
function startApp() {
    if (localStorage.getItem("shardChoice")) {
        // 从枯叶堆选完碎片回来
        loginPage.style.display = "none";
        mainPage.style.display = "block";
        meName.textContent = localStorage.getItem("playerName") || "无名氏";
        contactCai.style.display = "flex";
        contactCai.classList.remove("offline");
        contactBadge.style.display = "none";
        playEnding();
    } else if (localStorage.getItem("deadleafDone") === "1") {
        // 从枯叶堆发完消息回来
        loginPage.style.display = "none";
        mainPage.style.display = "block";
        meName.textContent = localStorage.getItem("playerName") || "无名氏";
        contactCai.style.display = "flex";
        contactCai.classList.remove("offline");
        contactBadge.style.display = "none";
        showNode("deadleafReply");
    }
}startApp();
</script>
